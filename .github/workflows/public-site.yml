# Publishes public-site/ (and only that folder) to GitHub Pages: Muny's home page, at
# https://mikedmor.github.io/muny/. Its screenshots are the guides' own (guides/images), copied in
# here, so new guide screenshots reach the site on their own.
# In the repository's Settings → Pages, Source must be "GitHub Actions".
name: Public site

on:
  push:
    branches: [main]
    paths: ["public-site/**", "guides/images/**", ".github/workflows/public-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Use the guides' screenshots
        run: mkdir -p public-site/shots && cp guides/images/*.png public-site/shots/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
