# Docker Compose file for Muny, using the published image.
#
#   mkdir -p data && chmod 700 data
#   umask 077; printf "MUNY_SECRET_KEY=%s\n" "$(openssl rand -base64 32)" > .env
#   docker compose up -d
#
# To build from this checkout instead:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  muny:
    image: ghcr.io/mikedmor/muny:1
    container_name: muny
    restart: unless-stopped
    # Must own the data folder on the host (run `id` to see yours).
    user: "1000:1000"
    ports:
      - "8420:8420"
    environment:
      TZ: America/New_York
    env_file: .env
    volumes:
      - ./data:/data
